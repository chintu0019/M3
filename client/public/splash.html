<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>M3</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html, body {
        margin: 0;
        height: 100%;
        background: #0e0e10;
        color: #e8e8ea;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }
      .wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        gap: 18px;
        user-select: none;
      }
      .logo {
        font-weight: 700;
        font-size: 32px;
        letter-spacing: 0.5px;
      }
      .msg {
        font-size: 13px;
        color: #8e8e95;
      }
      .spinner {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 2px solid #2a2a2e;
        border-top-color: #c084fc;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="logo">M3</div>
      <div class="spinner"></div>
      <div class="msg">Starting up…</div>
    </div>
  </body>
</html>
