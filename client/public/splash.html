<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>M3</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html, body {
        margin: 0;
        height: 100%;
        background: #121317;
        color: #ece6da;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }
      .wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        gap: 22px;
        user-select: none;
      }
      .mark {
        color: #ece6da;
        opacity: 0.92;
      }
      .mark svg {
        display: block;
      }
      .msg {
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #6c6d76;
      }
      .pulse {
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: #b33a2a;
        animation: pulse 1.6s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.25; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.35); }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="mark">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="84" height="84"
             fill="none" stroke="currentColor" stroke-width="2.999"
             stroke-linecap="butt" stroke-linejoin="miter" aria-label="M3">
          <g>
            <line x1="18.347" y1="27.802" x2="18.347" y2="99.445" />
            <line x1="101.653" y1="27.802" x2="101.653" y2="99.445" />
            <line x1="13.536" y1="99.445" x2="23.158" y2="99.445" />
            <line x1="96.842" y1="99.445" x2="106.464" y2="99.445" />
            <line x1="18.347" y1="27.802" x2="60.000" y2="84.075" />
            <line x1="101.653" y1="27.802" x2="60.000" y2="84.075" />
          </g>
          <g fill="currentColor" stroke="none">
            <circle cx="18.347" cy="27.802" r="8.747" />
            <circle cx="101.653" cy="27.802" r="8.747" />
            <circle cx="60.000" cy="84.075" r="8.747" />
          </g>
        </svg>
      </div>
      <div class="pulse"></div>
      <div class="msg">Starting up</div>
    </div>
  </body>
</html>
