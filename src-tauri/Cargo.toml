[package]
name = "m3-app"
version = "0.1.4"
description = "M3 personal brain — local desktop shell"
authors = ["M3"]
edition = "2021"
rust-version = "1.75"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `devtools` enables the WebKit Inspector (⌘⌥I on macOS) in release builds.
# Intentional for a single-user self-hosted app: no end-user has anything to
# hide from themselves, and being able to open Network/Console in production
# has saved us already (silent updater failures had no other diagnostic
# surface). Adds ~1MB to the binary.
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
which = "6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
