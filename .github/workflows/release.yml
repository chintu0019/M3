name: Release

# Trigger by pushing a v*.*.* tag, or run manually from the Actions tab.
# Each run produces a draft GitHub Release with the .app (macOS) and
# .AppImage / .deb (Linux), plus a signed `latest.json` the in-app
# updater fetches.
#
# Required repo secret: TAURI_SIGNING_PRIVATE_KEY (the contents of
# ~/.tauri/m3.key on the maintainer's machine, set via
# Settings → Secrets and variables → Actions → New repository secret).

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.platform }}
    env:
      # github.ref_name is git-ref-restricted, but routing it through env
      # keeps the workflow free of inline expansion in run: blocks.
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ matrix.platform }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Build m3 wheel
        run: ./scripts/build-wheel.sh

      - name: Install frontend deps
        working-directory: client
        run: npm ci --no-audit --no-fund

      - name: Build frontend bundle
        working-directory: client
        run: npm run build

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          projectPath: src-tauri
          tagName: ${{ env.TAG }}
          releaseName: M3 ${{ env.TAG }}
          releaseBody: |
            **macOS:** `brew install --cask chintu0019/m3/m3` (after `brew tap chintu0019/m3 https://github.com/chintu0019/M3.git`), or download the `.dmg` below and drag M3 to Applications.
            **Linux:** download the `.AppImage` or `.deb` below.

            Existing installs auto-update via the in-app **Restart now** banner — no manual step needed.
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

      - name: Upload macOS DMG for cask updater
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  update-cask:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # Use the default GITHUB_TOKEN; the push back to main is allowed
          # because the job declares contents: write.

      - uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: /tmp/dmg

      - name: Bump version + sha256 in Casks/m3.rb
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          DMG=$(find /tmp/dmg -name '*.dmg' -print -quit)
          if [ -z "$DMG" ]; then
            echo "no .dmg found in artifact" >&2
            exit 1
          fi
          DMG_SHA=$(shasum -a 256 "$DMG" | awk '{print $1}')
          echo "version=$VERSION sha256=$DMG_SHA"
          sed -i \
            -e "s|^  version \".*\"|  version \"${VERSION}\"|" \
            -e "s|^  sha256 \".*\"|  sha256 \"${DMG_SHA}\"|" \
            Casks/m3.rb

      - name: Commit and push
        run: |
          set -euo pipefail
          if git diff --quiet Casks/m3.rb; then
            echo "Cask already up to date, nothing to commit"
            exit 0
          fi
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add Casks/m3.rb
          # [skip ci] avoids a self-trigger loop if main ever runs CI on push.
          git commit -m "chore(cask): bump M3 to ${TAG} [skip ci]"
          git push origin main
