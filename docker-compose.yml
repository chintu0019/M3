services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: m3
      POSTGRES_PASSWORD: ${DB_PASSWORD:-m3dev}
      POSTGRES_DB: m3
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U m3"]
      interval: 5s
      timeout: 3s
      retries: 5
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    ports:
      - "6380:6379"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5
    ports:
      - "9000:9000"
      - "9001:9001"

  server:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      M3_DATABASE__URL: "postgresql+asyncpg://m3:${DB_PASSWORD:-m3dev}@postgres:5432/m3"
      M3_STORAGE__ENDPOINT: "minio:9000"
      M3_STORAGE__ACCESS_KEY: "${MINIO_ACCESS_KEY:-minioadmin}"
      M3_STORAGE__SECRET_KEY: "${MINIO_SECRET_KEY:-minioadmin}"
      M3_REDIS__URL: "redis://redis:6379"
      M3_AUTH__API_KEY: "${M3_API_KEY:-dev-key}"
      M3_CAPTURE__TELEGRAM__BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
    volumes:
      - fastembed_cache:/root/.cache/fastembed
      - m3_data:/data
    ports:
      - "8000:8000"

  worker:
    build: .
    command: m3-worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      M3_DATABASE__URL: "postgresql+asyncpg://m3:${DB_PASSWORD:-m3dev}@postgres:5432/m3"
      M3_STORAGE__ENDPOINT: "minio:9000"
      M3_STORAGE__ACCESS_KEY: "${MINIO_ACCESS_KEY:-minioadmin}"
      M3_STORAGE__SECRET_KEY: "${MINIO_SECRET_KEY:-minioadmin}"
      M3_REDIS__URL: "redis://redis:6379"
      M3_AUTH__API_KEY: "${M3_API_KEY:-dev-key}"
    volumes:
      - fastembed_cache:/root/.cache/fastembed
      - m3_data:/data

  caddy:
    image: caddy:2-alpine
    depends_on:
      - server
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"

volumes:
  pg_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:
  fastembed_cache:
  m3_data:
