[project]
name = "m3"
version = "0.1.0"
description = "M3 - Personal Knowledge Operating System"
requires-python = ">=3.12"
dependencies = [
    # Local-first HTTP app
    "fastapi[standard]>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "python-multipart>=0.0.18",
    "typer>=0.15",
    # Filesystem brain + indexes
    "sqlite-vec>=0.1.6",
    "python-frontmatter>=1.1",
    "pyyaml>=6.0",
    # LLM providers
    "anthropic>=0.42",
    "openai>=1.60",
    "ollama>=0.4",
    "fastembed>=0.4",
    # Capture channels
    "python-telegram-bot>=21.0",
    # Content extractors
    "trafilatura>=1.12",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
    "ebooklib>=0.18",
    # Image + PDF thumbnails for the Files browser
    "pillow>=10.4",
    "pypdfium2>=4.30",
    # Config parsing
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "pytest-mock>=3.14",
]

[project.scripts]
m3-server = "m3.app:run"
m3 = "m3.cli:app"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["m3*"]

# Bundle the React SPA inside the wheel. scripts/build-wheel.sh copies
# client/dist into m3/_client_dist/ before invoking pip wheel; without
# include-package-data + this glob, setuptools wouldn't ship the assets.
[tool.setuptools.package-data]
m3 = ["_client_dist/**/*"]

[tool.setuptools]
include-package-data = true

[tool.ruff]
target-version = "py312"
line-length = 100
